StylesPath = .github/vale-styles
MinAlertLevel = error
Packages = Microsoft, write-good
Vocab = exceptions

[*.md]
BasedOnStyles = Vale, Microsoft, write-good, Local
# "We" is normal in skill instructions ("we recommend"). The Microsoft
# guide forbids it; this repo does not.
Microsoft.We = NO

[*.mdx]
BasedOnStyles = Vale, Microsoft, write-good, Local
Microsoft.We = NO

# Eval tasks are scenario prompts, not published docs. The two local rules
# ban wording that goes out of date, and those prompts use it on purpose.
[skills/**/evals/**.md]
Local.RotPhrasing = NO
Local.OldHeadings = NO

# Silence one rule in a Markdown file with an HTML comment, for example:
# <!-- vale Local.OldHeadings = NO -->
