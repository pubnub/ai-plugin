StylesPath = .github/vale-styles
MinAlertLevel = error
Packages = Microsoft, write-good
Vocab = exceptions

[*.md]
BasedOnStyles = Vale, Microsoft, write-good, Local
# "We" is normal in skill instructions ("we recommend"). The Microsoft
# guide forbids it; this repo does not.
Microsoft.We = NO
# The synced skills fail these today. Turn them back on in the follow-up
# that cleans the wording.
Vale.Spelling = NO
Vale.Terms = NO
Microsoft.Dashes = NO
Microsoft.Contractions = NO
Microsoft.Foreign = NO
Microsoft.Auto = NO
Microsoft.Avoid = NO
Microsoft.Quotes = NO
Microsoft.Plurals = NO
Microsoft.HeadingColons = NO
Microsoft.Negative = NO
write-good.ThereIs = NO
write-good.So = NO
Local.RotPhrasing = NO
Local.OldHeadings = NO

[*.mdx]
BasedOnStyles = Vale, Microsoft, write-good, Local
Microsoft.We = NO
Vale.Spelling = NO
Vale.Terms = NO
Microsoft.Dashes = NO
Microsoft.Contractions = NO
Microsoft.Foreign = NO
Microsoft.Auto = NO
Microsoft.Avoid = NO
Microsoft.Quotes = NO
Microsoft.Plurals = NO
Microsoft.HeadingColons = NO
Microsoft.Negative = NO
write-good.ThereIs = NO
write-good.So = NO
Local.RotPhrasing = NO
Local.OldHeadings = NO

# Eval tasks are scenario prompts, not published docs. The two local rules
# ban wording that goes out of date, and those prompts use it on purpose.
[skills/**/evals/**.md]
Local.RotPhrasing = NO
Local.OldHeadings = NO

# Silence one rule in a Markdown file with an HTML comment, for example:
# <!-- vale Local.OldHeadings = NO -->
